name: Build Timer Plus

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: Timer-Plus-Windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Timer-Plus-macOS
          path: |
            dist/*.dmg
            dist/*.zip
