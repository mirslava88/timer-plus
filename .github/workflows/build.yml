name: Build Timer Plus

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package:win
      - name: Upload Windows installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-Item -LiteralPath 'dist\Timer-Plus-1.0.0-win-x64.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding utf8 -LiteralPath 'dist\SHA256SUMS-windows.txt'
          gh release upload v1.0.0 $installer.FullName 'dist\SHA256SUMS-windows.txt' --clobber --repo $env:GITHUB_REPOSITORY

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package:mac:x64
      - name: Smoke-test Intel application
        run: |
          app_binary="$(find dist -path '*/Contents/MacOS/*' -type f -perm +111 | head -n 1)"
          test -n "$app_binary"
          "$app_binary" > /tmp/timer-plus.log 2>&1 &
          app_pid=$!
          sleep 12
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat /tmp/timer-plus.log
            wait "$app_pid"
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true
      - name: Upload Intel macOS installers to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 *-mac-x64.dmg *-mac-x64.zip > SHA256SUMS-macos-x64.txt
          gh release upload v1.0.0 ./*-mac-x64.dmg ./*-mac-x64.zip ./SHA256SUMS-macos-x64.txt --clobber --repo "$GITHUB_REPOSITORY"

  macos-arm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package:mac:arm64
      - name: Smoke-test Apple Silicon application
        run: |
          app_binary="$(find dist -path '*/Contents/MacOS/*' -type f -perm +111 | head -n 1)"
          test -n "$app_binary"
          "$app_binary" > /tmp/timer-plus.log 2>&1 &
          app_pid=$!
          sleep 12
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat /tmp/timer-plus.log
            wait "$app_pid"
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true
      - name: Upload Apple Silicon macOS installers to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 *-mac-arm64.dmg *-mac-arm64.zip > SHA256SUMS-macos-arm64.txt
          gh release upload v1.0.0 ./*-mac-arm64.dmg ./*-mac-arm64.zip ./SHA256SUMS-macos-arm64.txt --clobber --repo "$GITHUB_REPOSITORY"
